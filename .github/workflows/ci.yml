name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ["**"]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    uses: fiap-soat-grupo36/reusable-actions/.github/workflows/_reusable-build-python.yml@main
    with:
      python_version: "3.13"
      project_dir: "./app"
      requirements_file: "src/requirements.txt"
      run_tests: true
      run_lint: false

  coverage-gate:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Instalar dependências
        run: python -m pip install -r app/src/requirements.txt
      - name: Compilar código Python
        run: python -m compileall -q app/src
      - name: Executar testes com limite de cobertura
        env:
          PYTHONPATH: app
        run: >-
          python -m pytest app/tests
          --cov=app/src
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-fail-under=80

  sonar:
    needs: coverage-gate
    uses: fiap-soat-grupo36/reusable-actions/.github/workflows/_reusable-sonar-python.yml@main
    with:
      python_version: "3.10"
      project_dir: "./app"
      requirements_file: "src/requirements.txt"
      sonar_org: ${{ vars.SONAR_ORG }}
      sonar_project_key: "nessaoana_vehicle-core"
      coverage_paths: "coverage.xml"
      run_tests: true
      sonar_extra_properties: |
        -Dsonar.python.version=3.10
        -Dsonar.exclusions=**/__pycache__/**,**/tests/**
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Verificar formatação do Terraform
        working-directory: infra
        run: terraform fmt -check -recursive
      - name: Inicializar Terraform sem backend
        working-directory: infra
        run: terraform init -backend=false -input=false
      - name: Validar infraestrutura
        working-directory: infra
        run: terraform validate

  create-pr:
    needs: [build, coverage-gate, sonar, infrastructure]
    if: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' }}
    uses: fiap-soat-grupo36/reusable-actions/.github/workflows/_reusable-create-pr.yml@main
    with:
      base: main
      head: ${{ github.ref_name }}
      title: "CI: ${{ github.ref_name }}"
      body: |
        Pull Request criado automaticamente após a conclusão bem-sucedida do CI.

        Commit: ${{ github.sha }}
      labels: '["automated", "ci"]'
