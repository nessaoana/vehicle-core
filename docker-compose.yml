services:
  api:
    build:
      context: .
      dockerfile: app/Dockerfile
    image: vehicle-core-api
    container_name: vehicle-core-api
    ports:
      - "8001:8000"
    env_file:
      - ./app/.env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: vehicle-core-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vehicle_core}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-vehicle_core}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # LocalStack Pro com o cluster EKS e o API Gateway (make localstack / make cluster).
  # Não sobe com o "docker compose up" padrão, que roda só a API e o banco.
  localstack:
    image: localstack/localstack-pro:latest
    container_name: vehicle-localstack
    profiles: ["cluster"]
    ports:
      - "4566:4566"
      - "4510-4559:4510-4559"
    environment:
      SERVICES: ${LOCALSTACK_SERVICES:-eks,iam,ec2,sts,s3,apigateway}
      DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      DEBUG: ${DEBUG:-0}
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  postgres_data:
  localstack_data:
